<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="light-mode dark-mode">
    <div class="container">
        <div class="text">
            <h1>Dark Theme Toggle Switch</h1>
            <p>Click the button to toggle the dark theme.</p>
            <p>Clicking it will switch between light and dark modes.</p>
        </div>
        <div class="button">
            <button id="toggle-theme-btn" class="dark-mode-btn">Change Theme</button>
        </div>
        <div class="image">
            <img id="light-mode-img" src="images/white cat.avif" alt="A white cat. Picture showing that toggling theme keeps image the same">
            
            <img id="dark-mode-img" src="images/black cat.avif" alt="A black cat. Picture showing that toggling theme keeps image the same">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
